<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classement — Quiz Sécurité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --nuit:#101822; --nuit2:#1A2532; --jaune:#FFD400;
    --orange:#FF6B35; --vert:#3DDC84; --blanc:#F5F7FA; --gris:#8A97A6;
    --argent:#C8D2DC; --bronze:#D89A6A;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Archivo',system-ui,sans-serif;
    background:var(--nuit);color:var(--blanc);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .rubalise{height:16px;flex:none;
    background:repeating-linear-gradient(-45deg,var(--jaune) 0 16px,var(--nuit) 16px 32px)}
  .entete{
    display:flex;justify-content:space-between;align-items:center;
    padding:22px 40px 8px;
  }
  h1{font-weight:900;font-size:40px;text-transform:uppercase;line-height:1}
  .entete small{display:block;color:var(--jaune);font-size:15px;font-weight:700;margin-bottom:4px}
  .fleche{background:var(--nuit2);border:2px solid #2A3948;border-radius:10px;color:var(--blanc);
    font-size:18px;font-weight:900;padding:8px 12px;cursor:pointer;font-family:inherit}
  .fleche:hover{border-color:var(--jaune)}
  .groupe-badge{background:var(--jaune);color:var(--nuit);font-weight:900;
    font-size:22px;padding:8px 22px;border-radius:999px}
  .contenu{flex:1;display:flex;gap:36px;padding:16px 40px 32px;min-height:0}

  /* Classement */
  .classement{flex:1;display:flex;flex-direction:column;min-width:0}
  .podium{display:flex;gap:14px;margin-bottom:16px}
  .marche{flex:1;background:var(--nuit2);border-radius:14px;padding:16px;text-align:center;border-top:5px solid var(--gris)}
  .marche .rang{font-weight:900;font-size:26px}
  .marche .nom{font-weight:700;font-size:24px;margin:4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .marche .pts{font-weight:900;font-size:30px;color:var(--jaune)}
  .marche.or{border-top-color:var(--jaune);transform:scale(1.05)}
  .marche.or .rang{color:var(--jaune)}
  .marche.argent{border-top-color:var(--argent)} .marche.argent .rang{color:var(--argent)}
  .marche.bronze{border-top-color:var(--bronze)} .marche.bronze .rang{color:var(--bronze)}
  .liste{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
  .ligne{display:flex;align-items:center;gap:14px;background:var(--nuit2);
    border-radius:10px;padding:11px 18px;font-size:22px}
  .ligne .pos{font-weight:900;color:var(--gris);width:38px}
  .ligne .nom{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ligne .avancee{color:var(--gris);font-size:14px;font-weight:500}
  .ligne .pts{font-weight:900;color:var(--jaune);min-width:90px;text-align:right}
  .vide{color:var(--gris);font-size:20px;font-weight:500;text-align:center;margin-top:60px;line-height:1.6}

  /* Panneau QR */
  .panneau{width:420px;flex:none;display:flex;flex-direction:column;align-items:center;
    background:var(--nuit2);border-radius:16px;padding:26px 22px;gap:14px;align-self:flex-start}
  .panneau .titre{font-weight:900;font-size:24px;text-transform:uppercase;text-align:center;line-height:1.2}
  #qr{background:#fff;padding:12px;border-radius:10px}
  .lien{font-size:15px;color:var(--gris);word-break:break-all;text-align:center;font-weight:500}
  .participants{font-weight:700;color:var(--vert);font-size:21px}
  .maj{font-size:12px;color:var(--gris)}
</style>
</head>
<body>
<div class="rubalise"></div>
<div class="entete">
  <h1><small>Quiz sécurité · CDES × FOCAST</small>Classement en direct</h1>
  <div style="display:flex;align-items:center;gap:10px">
    <button class="fleche" onclick="changerSession(-1)">◀</button>
    <div class="groupe-badge" id="badge">Session 1</div>
    <button class="fleche" onclick="changerSession(1)">▶</button>
  </div>
</div>
<div class="contenu">
  <div class="classement">
    <div class="podium" id="podium" style="display:none">
      <div class="marche argent" id="m2"><div class="rang">2</div><div class="nom"></div><div class="pts"></div></div>
      <div class="marche or" id="m1"><div class="rang">1</div><div class="nom"></div><div class="pts"></div></div>
      <div class="marche bronze" id="m3"><div class="rang">3</div><div class="nom"></div><div class="pts"></div></div>
    </div>
    <div class="liste" id="liste">
      <div class="vide">En attente des premières équipes…<br>Un téléphone par équipe : scannez le QR code !</div>
    </div>
  </div>
  <div class="panneau">
    <div class="titre">Un téléphone par équipe<br>Scannez pour jouer</div>
    <div id="qr"></div>
    <div class="lien" id="lien"></div>
    <div class="participants" id="participants"></div>
    <div class="maj" id="maj"></div>
  </div>
</div>

<script>
/* ============ CONFIGURATION ============ */
// Colle ici la même URL Apps Script que dans quiz.html
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbynDmGFFd-BlKbR2i9zK4ZyBlB0uU-FdJTWVMquIwoX0h57EQE33DAQl29VS3yng-A/exec";
const NB_QUESTIONS = 33; // 28 questions + puzzle + 4 chasses
const INTERVALLE = 5000; // rafraîchissement (ms)

const params = new URLSearchParams(location.search);
const GROUPE = params.get("groupe") || "1";
document.getElementById("badge").textContent = "Session " + GROUPE;

  const n = Math.max(1, (parseInt(GROUPE)||1) + delta);
  const u = new URL(location.href); u.searchParams.set("groupe", n);
  location.href = u.toString();
}

const urlQuiz = location.href.replace(/scores\.html/,"quiz.html");
document.getElementById("lien").textContent = urlQuiz;
if(QR_INTEGRES[GROUPE]){
  const im = document.createElement("img"); im.src = QR_INTEGRES[GROUPE]; im.width = 340; im.height = 340;
  im.style.imageRendering = "pixelated"; document.getElementById("qr").appendChild(im);
} else if(typeof QRCode !== "undefined"){
  new QRCode(document.getElementById("qr"), {text:urlQuiz, width:340, height:340, correctLevel:QRCode.CorrectLevel.M});
}

async function rafraichir(){
  if(SCRIPT_URL.indexOf("http") !== 0) return;
  try{
    const rep = await fetch(SCRIPT_URL + "?groupe=" + encodeURIComponent(GROUPE) + "&t=" + Date.now());
    const data = await rep.json();
    afficher(data.joueurs || []);
    document.getElementById("maj").textContent = "Mis à jour à " + new Date().toLocaleTimeString("fr-FR");
  }catch(e){ /* réessaie au prochain tour */ }
}

function afficher(joueurs){
  joueurs.sort((a,b)=>b.total-a.total || b.repondu-a.repondu);
  document.getElementById("participants").textContent =
    joueurs.length + " équipe" + (joueurs.length>1?"s":"") + " en jeu";

  const podium = document.getElementById("podium");
  const liste = document.getElementById("liste");

  if(joueurs.length === 0){
    podium.style.display = "none";
    liste.innerHTML = '<div class="vide">En attente des premières équipes…<br>Un téléphone par équipe : scannez le QR code !</div>';
    return;
  }

  // Podium (top 3)
  podium.style.display = "flex";
  [["m1",0],["m2",1],["m3",2]].forEach(([id,i])=>{
    const m = document.getElementById(id);
    if(joueurs[i]){
      m.style.visibility = "visible";
      m.querySelector(".nom").textContent = joueurs[i].prenom;
      m.querySelector(".pts").innerHTML = joueurs[i].total + " pts" +
        (joueurs[i].pct != null ? '<br><span style="font-size:15px;color:var(--gris)">' + joueurs[i].pct + " % de réussite</span>" : "");
    } else m.style.visibility = "hidden";
  });

  // Reste du classement
  liste.innerHTML = "";
  joueurs.slice(3).forEach((j,i)=>{
    const d = document.createElement("div");
    d.className = "ligne";
    d.innerHTML = '<span class="pos">'+(i+4)+'</span>'+
      '<span class="nom"></span>'+
      '<span class="avancee">'+ (j.fini ? "terminé ✔" : j.repondu + "/" + NB_QUESTIONS) +'</span>'+
      '<span class="pts">'+j.total+' pts' + (j.pct != null ? ' · '+j.pct+' %' : '') + '</span>';
    d.querySelector(".nom").textContent = j.prenom;
    liste.appendChild(d);
  });
}

rafraichir();
setInterval(rafraichir, INTERVALLE);
</script>
</body>
</html>
